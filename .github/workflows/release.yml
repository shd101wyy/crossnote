name: Publish a package to the npm registry

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          # full history so we can push a release commit to master and develop
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install nodejs
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: .tool-versions
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Lint and typecheck
        run: pnpm run check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Bump version
        id: bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          NEW_VERSION=$(npm version ${{ inputs.bump }} --no-git-tag-version)
          echo "new-version=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2.0.0
        with:
          validation_level: warn
          version: ${{ steps.bump.outputs.new-version }}
          path: CHANGELOG.md

      - name: Commit, tag and push
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
        run: |
          git add package.json
          git commit -m "$NEW_VERSION"
          git tag "$NEW_VERSION"
          git push origin HEAD:master
          git push origin "refs/tags/$NEW_VERSION"

      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
          RELEASE_NOTES: ${{ steps.changelog_reader.outputs.changes }}
        run: |
          gh release create "$NEW_VERSION" \
            --title "$NEW_VERSION" \
            --notes "$RELEASE_NOTES" \
            --target master

      - name: Sync release commit back to develop
        run: git push origin HEAD:develop
